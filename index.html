<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>오늘한컷</title>
<meta name="description" content="우리 가족의 하루 한 장">
<meta name="theme-color" content="#F7F4FF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0D1C" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-width column over a soft pastel glow, frosted cards, gradient accents, a gold shimmer reserved for winners. */
:root{
  --bg:#F7F4FF; --card:rgba(255,255,255,.80); --card-solid:#FFFFFF; --fg:#1F1B3A; --muted:#6B6688; --line:rgba(120,100,200,.16);
  --accent:#6A5CFF; --accent-ink:#FFFFFF; --accent-soft:rgba(106,92,255,.10);
  --grad:linear-gradient(120deg,#5B7CFA 0%,#9B6CFF 48%,#FF7EB6 100%);
  --gold:#C98A12; --gold-grad:linear-gradient(135deg,#FFE7A0 0%,#F5B83D 35%,#FFF6D2 52%,#E59A1F 75%,#FFD873 100%);
  --gold-soft:rgba(255,214,120,.22); --danger:#D2344A;
  --glow1:rgba(255,150,200,.45); --glow2:rgba(120,150,255,.40); --glow3:rgba(255,205,150,.40);
  --shadow:0 10px 30px -12px rgba(70,50,160,.25),0 2px 6px rgba(70,50,160,.06);
  --display:"Gaegu","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0E0D1C; --card:rgba(30,28,56,.72); --card-solid:#1C1A36; --fg:#F1EEFF; --muted:#A9A3CC; --line:rgba(190,175,255,.14);
  --accent:#A99BFF; --accent-ink:#14112B; --accent-soft:rgba(169,155,255,.14);
  --gold:#FFD36B; --gold-soft:rgba(255,200,90,.12); --danger:#FF8A9A;
  --glow1:rgba(200,80,160,.28); --glow2:rgba(80,100,255,.30); --glow3:rgba(150,90,255,.22);
  --shadow:0 12px 32px -14px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.25);
  color-scheme:dark}}
*{box-sizing:border-box}
html,body{background:var(--bg);margin:0}
body{color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:-20vmax;z-index:-1;pointer-events:none;
  background:radial-gradient(38vmax 38vmax at 12% 8%,var(--glow1),transparent 70%),
             radial-gradient(40vmax 40vmax at 92% 18%,var(--glow2),transparent 70%),
             radial-gradient(44vmax 44vmax at 50% 105%,var(--glow3),transparent 70%);
  animation:drift 22s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(3vmax,-2vmax,0) scale(1.06)}}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:20px}
.brand{font-family:var(--display);font-weight:700;font-size:2.35rem;line-height:1;position:relative}
.brand .word{background:var(--grad);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 6s ease-in-out infinite alternate}
.brand .spark{display:inline-block;margin-left:4px;font-size:1.2rem;vertical-align:top;color:#FFB800;animation:twinkle 2.4s ease-in-out infinite}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:.78rem;color:var(--muted);letter-spacing:.04em;margin-top:8px}
@keyframes flow{to{background-position:100% 0}}
@keyframes twinkle{0%,100%{transform:scale(.7) rotate(0);opacity:.55}50%{transform:scale(1.15) rotate(20deg);opacity:1}}
.me{font-size:.85rem;color:var(--muted);text-align:right;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.me:empty{display:none}
.me b{color:var(--fg);font-weight:600}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font:inherit;font-size:.8rem;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
h2{font-family:var(--display);font-weight:700;font-size:1.65rem;line-height:1.15;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:.9rem;margin:2px 0 0}
section{display:flex;flex-direction:column;gap:12px;animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0;
  box-shadow:var(--shadow);backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.grid>.card:nth-child(2){animation-delay:.06s}.grid>.card:nth-child(3){animation-delay:.12s}.grid>.card:nth-child(4){animation-delay:.18s}
.notice{background:var(--accent-soft);border:1px solid var(--line);border-radius:16px;padding:12px 14px;font-size:.9rem;margin:0}
.notice.warn{background:var(--gold-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);font-size:.85rem;background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.chip.done{border-color:transparent;background:var(--grad);color:#fff;font-weight:600;box-shadow:0 6px 16px -8px rgba(120,90,255,.8)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
.chip.done .dot{background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.35)}
.photo{position:relative;border-radius:16px;overflow:hidden;background:var(--accent-soft);aspect-ratio:4/3;max-width:100%}
.photo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.card:hover .photo img{transform:scale(1.04)}
.photo.msg{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.85rem;text-align:center;padding:12px;
  background:repeating-linear-gradient(135deg,var(--accent-soft) 0 12px,transparent 12px 24px)}
.who{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.who b{font-weight:600}
.cap{color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:420px){.grid{grid-template-columns:1fr}}
.btn{appearance:none;position:relative;overflow:hidden;display:block;width:100%;text-align:center;border-radius:14px;font:500 .95rem var(--body);padding:11px 14px;cursor:pointer;
  border:1px solid var(--line);background:var(--card-solid);color:var(--fg);transition:transform .15s ease,box-shadow .2s ease}
.btn:active{transform:scale(.97)}
.btn.primary,.btn.on{border:0;background:var(--grad);background-size:160% 100%;color:#fff;font-weight:600;box-shadow:0 10px 22px -10px rgba(120,90,255,.9)}
.btn.primary{font-size:1.02rem;padding:14px 16px}
.btn.primary::after,.btn.on::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;transform:skewX(-20deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
.btn[aria-disabled="true"],.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.on:disabled{opacity:1}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input[type=text]{font:inherit;color:var(--fg);background:var(--card-solid);border:1px solid var(--line);border-radius:14px;padding:11px 13px;width:100%;transition:border-color .2s,box-shadow .2s}
input[type=text]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.winner{border:2px solid transparent;overflow:hidden;
  background:linear-gradient(var(--card-solid),var(--card-solid)) padding-box,var(--gold-grad) border-box;
  box-shadow:0 14px 34px -14px rgba(229,154,31,.75),0 0 0 1px rgba(255,215,120,.25);animation:rise .45s both,glow 3s ease-in-out infinite}
.winner::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
  background:linear-gradient(115deg,transparent 35%,rgba(255,240,190,.55) 50%,transparent 65%);background-size:250% 100%;animation:sweep 4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 16px 40px -12px rgba(229,154,31,.95),0 0 0 1px rgba(255,215,120,.45)}}
@keyframes sweep{0%,40%{background-position:120% 0}100%{background-position:-120% 0}}
.badge{align-self:flex-start;font-family:var(--display);font-weight:700;font-size:1.25rem;line-height:1;padding:6px 14px 7px;border-radius:999px;color:#5A3A00;
  background:var(--gold-grad);background-size:200% 100%;animation:flow 3s ease-in-out infinite alternate;box-shadow:0 4px 12px -4px rgba(229,154,31,.8)}
.sparkles{position:absolute;inset:0;pointer-events:none;z-index:2}
.sparkles i{position:absolute;font-style:normal;color:#FFC83D;text-shadow:0 0 8px rgba(255,210,90,.9);animation:twinkle 2.2s ease-in-out infinite}
.votes{font-variant-numeric:tabular-nums;color:var(--gold);font-weight:600;font-size:.95rem}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.lbl{font-size:.78rem;color:var(--muted);letter-spacing:.04em;margin-bottom:4px}
.err{color:var(--danger);font-size:.9rem;margin:0}
.empty{color:var(--muted);font-size:.92rem;text-align:center;padding:28px 12px;background:var(--card);border:1px dashed var(--line);border-radius:22px}
.empty::before{content:"✨";display:block;font-size:1.8rem;margin-bottom:6px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:0 max(10px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px))}
nav.tabs .in{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px;border-radius:24px;
  background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 9px;border-radius:18px;color:var(--muted);text-decoration:none;font-size:.74rem;font-weight:500;transition:background .25s,color .25s}
nav.tabs a .t{font-family:var(--display);font-size:1.25rem;font-weight:700;line-height:1}
nav.tabs a[aria-current="page"]{background:var(--grad);color:#fff;box-shadow:0 8px 18px -8px rgba(120,90,255,.9)}
.names{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.names .btn{font-family:var(--display);font-size:1.45rem;font-weight:700;padding:18px 8px}
.names .btn:hover{border-color:var(--accent);box-shadow:0 8px 20px -10px rgba(120,90,255,.7)}
.howto h3{font-family:var(--display);font-size:1.35rem;margin:0}
.howto summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;font-family:var(--display);font-size:1.3rem;font-weight:700}
.howto summary::-webkit-details-marker{display:none}
.howto summary::after{content:"펼치기";font-family:var(--body);font-size:.8rem;font-weight:500;color:var(--accent)}
.howto[open] summary::after{content:"접기"}
details.howto{display:block}
details.howto[open]>*+*{margin-top:12px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:st}
.steps li{display:flex;gap:12px;align-items:flex-start}
.steps .ic{flex:none;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-size:1.25rem;background:var(--accent-soft);border:1px solid var(--line)}
.steps b{display:block;font-weight:600}
.steps p{margin:1px 0 0;color:var(--muted);font-size:.88rem;line-height:1.45}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;opacity:.95;animation:fall var(--d,1.6s) cubic-bezier(.25,.6,.4,1) forwards}
@keyframes fall{to{transform:translate3d(var(--x,0),105vh,0) rotate(var(--r,540deg));opacity:.2}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}.confetti{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="word">오늘한컷</span><span class="spark" aria-hidden="true">✦</span><small id="todayLabel">우리 가족의 하루 한 장</small></div>
    <div class="me" id="meBox"></div>
  </header>
  <main id="view"><div class="empty">가족 사진을 불러오는 중이에요…</div></main>
</div>
<nav class="tabs" id="tabs" aria-label="화면" hidden>
  <div class="in">
    <a href="#today" data-v="today"><span class="t">오늘</span>사진 올리기</a>
    <a href="#vote" data-v="vote"><span class="t">투표</span>어제 사진</a>
    <a href="#result" data-v="result"><span class="t">결과</span>1위 공개</a>
    <a href="#gallery" data-v="gallery"><span class="t">갤러리</span>이번 주 그림</a>
  </div>
</nav>
<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
