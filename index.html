<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>오늘한컷</title>
<meta name="description" content="우리 가족의 하루 한 장">
<meta name="theme-color" content="#2E63E6">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-width column, a crayon-handwritten display face over a quiet sans body, bottom tab bar. */
:root{
  --bg:#F6F7FA; --card:#FFFFFF; --fg:#1D2130; --muted:#646A7E; --line:#E2E5EE;
  --accent:#2E63E6; --accent-ink:#FFFFFF; --accent-soft:#E4ECFD;
  --gold:#E59A1F; --gold-soft:#FCEFD6; --danger:#C4372B;
  --display:"Gaegu","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#13151C; --card:#1C1F29; --fg:#ECEFF6; --muted:#9BA1B5; --line:#2B2F3C;
  --accent:#7FA3FF; --accent-ink:#0E1324; --accent-soft:#232C47;
  --gold:#F3B44E; --gold-soft:#3A2F1A; --danger:#FF8A7E; color-scheme:dark}}
*{box-sizing:border-box}
html,body{background:var(--bg);margin:0}
body{color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55;
  padding-top:env(safe-area-inset-top,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:18px}
.brand{font-family:var(--display);font-weight:700;font-size:2.1rem;line-height:1}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:.78rem;color:var(--muted);letter-spacing:.04em;margin-top:6px}
.me{font-size:.85rem;color:var(--muted);text-align:right}
.me b{color:var(--fg);font-weight:600}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
h2{font-family:var(--display);font-weight:700;font-size:1.55rem;line-height:1.15;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:.9rem;margin:2px 0 0}
section{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.notice{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:.9rem;margin:0}
.notice.warn{background:var(--gold-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);font-size:.85rem;background:var(--card)}
.chip.done{border-color:var(--accent);color:var(--accent);font-weight:600}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
.chip.done .dot{background:var(--accent)}
.photo{position:relative;border-radius:10px;overflow:hidden;background:var(--line);aspect-ratio:4/3;max-width:100%}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo.msg{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.85rem;text-align:center;padding:12px}
.who{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.who b{font-weight:600}
.cap{color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:420px){.grid{grid-template-columns:1fr}}
.btn{appearance:none;display:block;width:100%;text-align:center;border-radius:12px;font:500 .95rem var(--body);padding:11px 14px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.btn.primary{border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:1rem;padding:12px 16px}
.btn.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.btn[aria-disabled="true"],.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input[type=text]{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.winner{border:2px solid var(--gold);background:linear-gradient(180deg,var(--gold-soft),var(--card) 60%)}
.badge{font-family:var(--display);font-weight:700;font-size:1.15rem;color:var(--gold)}
.votes{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.lbl{font-size:.78rem;color:var(--muted);letter-spacing:.04em;margin-bottom:4px}
.err{color:var(--danger);font-size:.9rem;margin:0}
.empty{color:var(--muted);font-size:.92rem;text-align:center;padding:22px 8px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px 12px;color:var(--muted);text-decoration:none;font-size:.82rem;font-weight:500}
nav.tabs a .t{font-family:var(--display);font-size:1.25rem;font-weight:700;line-height:1}
nav.tabs a[aria-current="page"]{color:var(--accent)}
.names{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.names .btn{font-family:var(--display);font-size:1.35rem;font-weight:700;padding:14px 8px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">오늘한컷<small id="todayLabel">우리 가족의 하루 한 장</small></div>
    <div class="me" id="meBox"></div>
  </header>
  <main id="view"><div class="empty">가족 사진을 불러오는 중이에요…</div></main>
</div>
<nav class="tabs" id="tabs" aria-label="화면" hidden>
  <div class="in">
    <a href="#today" data-v="today"><span class="t">오늘</span>사진 올리기</a>
    <a href="#vote" data-v="vote"><span class="t">투표</span>어제 사진</a>
    <a href="#result" data-v="result"><span class="t">결과</span>1위 공개</a>
    <a href="#gallery" data-v="gallery"><span class="t">갤러리</span>이번 주 그림</a>
  </div>
</nav>
<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
